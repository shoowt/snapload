name: Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          printf '%s' "$KEYSTORE" | base64 --decode > signing/snapload.jks
      - name: Build signed APK and run lint
        working-directory: android
        env:
          SNAPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SNAPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Prepare download
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/SnapLoad-Android.apk
          cd dist
          sha256sum SnapLoad-Android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SnapLoad-Android
          path: dist/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "SnapLoad $GITHUB_REF_NAME" --notes "Aplicativo Android nativo e independente do Render. Android 10 ou superior. Baixe e instale SnapLoad-Android.apk; permita a instalação pelo navegador quando o Android solicitar."
